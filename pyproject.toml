[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femsa-quant"
# Upstream Slots version this fork is based on, plus a local segment.
# Bump the base part when merging a new upstream release.
version = "1.1.0+femsa.1"
description = "fEMSA quantification — Slots Gel Annotator forked with raw-intensity band extraction and apparent-Kd fitting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Otto Chipashvili", email = "otto.chipashvili@yale.edu"},
]
maintainers = [
    {name = "Otto Chipashvili", email = "otto.chipashvili@yale.edu"},
]
# Upstream: Billy Ngo <billy.ngo0108@gmail.com>, MIT licensed.
# https://github.com/billy-ngo/slots-gel-annotator
keywords = [
    "gel",
    "electrophoresis",
    "annotation",
    "biology",
    "bioinformatics",
    "molecular-biology",
    "ladder",
    "SVG",
    "publication",
    "slots",
    "EMSA",
    "fEMSA",
    "Kd",
    "densitometry",
    "curve-fitting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core image stack — used for raw decoding, channel-max conversion,
    # LUT preview generation, and saturation overlay rendering.
    "numpy>=1.24",
    "Pillow>=10.0",
    "tifffile>=2023.1.0",
    # scipy provides the morphological operations used by the
    # saturation-overlay endpoint. Pure-Python fallback is in place if
    # the import fails, but scipy is widely available so we depend on
    # it directly to avoid silently degraded output on common installs.
    "scipy>=1.10",
    # Web stack — Slots Gel Annotator runs as a local FastAPI server
    # and serves a single-page frontend. uvicorn[standard] pulls in
    # httptools + websockets for the best local-loopback performance.
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # Fork addition: femsa-fit renders the binding-curve and residual
    # figures. Kept a hard dependency rather than an extra because the
    # fitting CLI is half of what this fork is for — an install that
    # cannot draw the curve is not a working install.
    "matplotlib>=3.7",
]

[project.scripts]
# Deliberately NOT `slots`: this fork installs into its own venv
# alongside a stock slotsgeltool, and reusing the command name would
# make which binary you get depend on PATH order.
femsa = "gel_annotator.cli:main"
femsa-fit = "gel_annotator.fit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/chipashvili/EMSA-quant"
Repository = "https://github.com/chipashvili/EMSA-quant"
Upstream = "https://github.com/billy-ngo/slots-gel-annotator"

[tool.setuptools.packages.find]
include = ["gel_annotator*"]

[tool.setuptools.package-data]
# Ship the entire frontend directory (HTML, JS, CSS) and any bundled
# icon assets. The frontend is the application's UI; without it the
# backend has nothing to serve.
gel_annotator = [
    "frontend/*",
    "frontend/**/*",
    "assets/*",
    "*.ico",
    "*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette's TestClient still imports httpx; not our call to make.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
